<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body>
    <h1>Payment Form</h1>
    <p>Required fields are followed by *</p>
    <!--- Post method addded here-->
    <!---form tag: Collects use data. method="post" sends data securely in HTTP request body-->
    <form action="" method="Post" >

        <h2>Contact Information</h2>

        <!--Required Attribute: Prevents form submission if input field is empty-->
        <p>Name: * <input type="Text" name="name" required</p>

        <!---Fieldset Tag: Groups related elements together with a visible border box-->
        <fieldest>
            <!--Legend Tag: Defines a caption/ title for the fieldset box-->
            <legend>Gender: *</legend>
            <p>
                <!--Radio Input: Allows selecting only one option(both inputs share the same name attributes)-->
                Male <input type= "radio" name="gender" id="male" required>
                Female <input type= "radio" name="gender" id="male" required>
            </p>
        </fieldest>

        <!--Textarea Tag: Provides a multi-line input field for longer text like addresses-->
        <p>
            Addresss: <br>
            <textarea name="address" id="address" cols="50" rows="8"></textarea>
        </p>

        <p>Email: *<input type="email" name="email" id="email" required></p>
       
        <p>Pincode: *<input type="number" name="pincode" id="pincode" required></p>
        
        <h2>Payment Information</h2>

        <!--Select & Option Tags: Creates a dropdown list for selecting options-->
        <p>
            Card type: *
            <select name="card_type" id="card_type" required>
                <option value="">---Select a Card Type---</option>
                <option value="visa">Visa</option>
                <option value="mastercard">Mastercard</option>
                <option value="rupay">Rupay</option>
            </select> 
        </p>
        <p>Card Number * <input type="number" name="card_number" id="card_number" required></p>
        
        <!--Date Input: Displays an interactive calendar picker-->
        <p>Expiration Date: * <input type="date" name="exp_date" id="exp_date" required></p>
        
        <!--Password Input:Masks charcters as dots(....) for confidential security-->
        <p>CVV * <input type="password" name="cvv" id="cvv" required></p>

        <!--Submit Input: Submits the completed form data-->
        <input type="submit" value="Pay Now">
        </form>
</body>
</html>
